# CrimeNet AI — nginx alternative to Caddy (use ONE of the two, not both)
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/crimenet
#   sudo ln -s /etc/nginx/sites-available/crimenet /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d crimenet.example.gov.in      # issues TLS + rewrites this file
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx forwards everything to serve_prod.py on 127.0.0.1:8000, which serves both
# the built SPA and the API from one origin.

upstream crimenet_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name crimenet.example.gov.in;

    # certbot fills the TLS blocks in; everything below also applies to :443
    # once you run `certbot --nginx`.

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 8M;   # app caps uploads at 5 MB and answers 413 itself

    # Long-lived cache for fingerprinted build output; everything else revalidates.
    location /assets/ {
        proxy_pass http://crimenet_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://crimenet_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;    # analysis endpoints do real work
        proxy_buffering off;
    }

    # Unauthenticated liveness probe for your monitor. Keep it on the API host so
    # the check exercises the application, not just nginx.
    location = /healthz {
        proxy_pass http://crimenet_app/api/health;
        access_log off;
    }
}
