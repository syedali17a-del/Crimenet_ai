# CrimeNet AI — Render blueprint (single service: API + built SPA on one origin)
#
# Push this file to the repo root (Render looks for render.yaml at the root of the
# connected repository) and choose "New > Blueprint" in the Render dashboard.
#
#   cp deploy/render.yaml render.yaml && git add render.yaml && git commit -m "deploy" && git push
#
# WHY ONE SERVICE: the SPA fetches /api with relative paths, so the UI and the API
# must share an origin. serve_prod.py provides exactly that:
#     /api/*  -> FastAPI         /*  -> frontend/dist (SPA fallback for deep links)
#
# CAVEAT, READ THIS: the buildCommand below needs BOTH Node and Python in the same
# build image. Render's native Python runtime normally ships Node; if your build
# fails at `npm ci`, use the split deployment instead (static site + API service,
# with a proxy rewrite for /api/*) — see DEPLOY.md section 4B. That variant needs
# no Node on the Python host at all.

services:
  - type: web
    name: crimenet-ai
    runtime: python
    plan: free          # a persistent disk requires a paid instance type
    region: singapore      # nearest Render region to India
    healthCheckPath: /api/health

    buildCommand: |
      set -e
      python -m pip install --upgrade pip
      pip install -r backend/requirements.txt
      python -m spacy download en_core_web_sm
      cd frontend
      npm ci --no-audit --no-fund
      npm run build

    # --workers 1 on purpose: the login lockout counters are per-process and the
    # audit ledger is a single SQLite file. Scale out only after adding Redis and
    # PostgreSQL (see DEPLOY.md section 6).
    startCommand: cd backend && uvicorn serve_prod:app --host 0.0.0.0 --port $PORT --proxy-headers --workers 1

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"

      # "demo" keeps the published-literal safety checks in demo mode with random
      # per-process secrets, which means every restart invalidates sessions.
      # Use "production" for a real deployment — it then REFUSES TO START without
      # the two secrets below, which is the behaviour you want.
      - key: CRIMENET_ENVIRONMENT
        value: demo

      - key: CRIMENET_JWT_SECRET
        generateValue: true      # rotate by setting a new value here
      - key: CRIMENET_FIELD_KEY
        generateValue: true      # WARNING: changing this makes existing encrypted fields unreadable

      - key: CRIMENET_TLS_MODE
        value: TERMINATED_AT_GATEWAY

      # STATELESS BY DESIGN ON THIS FREE TIER. /tmp is wiped on every redeploy
      # and on most restarts — a persistent disk that survives those events is
      # a paid Render add-on, which this deployment deliberately does not use
      # so the public demo link stays free. This means the audit ledger and
      # object storage on THIS specific instance do not carry a persistence
      # guarantee, and that's a known, accepted trade-off, not an oversight.
      #
      # The tamper-evidence and integrity claims themselves are proven at the
      # code level, independent of where the ledger file happens to live: run
      #   backend/scripts/tamper_test.py
      # against this same codebase and it detects both a direct object+hash
      # rewrite and a full ledger-rewrite attack, reproducibly, every time.
      # For a deployment where the ledger itself must persist across
      # restarts, attach a Render persistent disk (paid) or deploy on a host
      # with real disk persistence per DEPLOY.md Path A, and point these same
      # three variables at that disk instead of /tmp.
      - key: CRIMENET_LEDGER_PATH
        value: /tmp/ledger.db
      - key: CRIMENET_LEDGER_WITNESS_PATH
        value: /tmp/ledger_witness.db
      - key: CRIMENET_OBJECT_STORAGE
        value: /tmp/object_storage
      - key: CRIMENET_DIST
        value: /opt/render/project/src/frontend/dist

      # Optional real backing services. Leave unset to run the labelled embedded
      # fallbacks; /api/health reports which profile is actually active.
      # - key: CRIMENET_POSTGRES_DSN
      #   fromDatabase: { name: crimenet-db, property: connectionString }

    
# Optional managed PostgreSQL. Uncomment together with CRIMENET_POSTGRES_DSN above.
# databases:
#   - name: crimenet-db
#     plan: basic-256mb
#     region: singapore
